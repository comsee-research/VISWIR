# Définition de l’espace de recherche pour Optuna

facteur_swir:
  type: float
  min: 0.0
  max: 1.0
  step: 0.01

beta:
  type: float
  min: 1.0
  max: 5.0
  step: 0.01

level:
  type: int
  min: 1
  max: 6
  step: 1

apply_gamma:
  type: categorical
  values: [True]

gamma_value:
  type: float
  min: 0.01
  max: 4.0
  step: 0.01
